<li class="task$css">
<form method="post" action="/tasks/$id/toggle"><button class="toggle" type="submit" aria-label="$toggle_name">$toggle_label</button></form>
<span class="task-text">$text</span>
$due
<form method="post" action="/tasks/$id/delete"><button class="delete" type="submit" aria-label="$delete_name">&times;</button></form>
</li>
