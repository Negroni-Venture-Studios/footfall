<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d">
<title id="t">The build order: the sandbox and the tester come first, because the security model depends on them, then runs, the droplet, agents, and the device wall and report</title>
<desc id="d">Phase 1 builds the sandbox and the tester (the runner, gVisor containers, the egress proxy, the browsers, the tester's tools and loop, and the demo app) and is done when every isolation test passes. Phase 2 builds runs (queue, limits, scripted checks, findings, merge, spend) and is done when a run produces a merged report. Phase 3 puts Footfall on a droplet (compose, Caddy, cloud-init, the GitHub App, sign-in, settings, tokens) and is done when a fresh droplet can be set up from the docs. Phase 4 builds the MCP endpoint and the agent skill and is done when an agent fixes something Footfall found. Phase 5 builds the live device wall and the report and is done when the mockups' layouts are live. Phase 6, later, covers an OAuth server, replaying a finding to check a fix, comparing versions and iOS on a Mac.</desc>
<defs>
  <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
</defs>
<rect class="bg" width="1000" height="330"/>

<!-- Phase 1 -->
<rect class="key" x="20" y="40" width="150" height="270" rx="8"/>
<text class="heading" x="34" y="64">PHASE 1</text>
<text class="title" x="34" y="88">Sandbox</text>
<text class="label" x="34" y="112">runner, gVisor</text>
<text class="label" x="34" y="130">egress proxy</text>
<text class="label" x="34" y="148">browsers</text>
<text class="label" x="34" y="166">tester tools, loop</text>
<text class="label" x="34" y="184">demo app</text>
<text class="heading" x="34" y="250">DONE WHEN</text>
<text class="small" x="34" y="270">every isolation</text>
<text class="small" x="34" y="286">test passes</text>

<!-- Phase 2 -->
<rect class="box" x="186" y="40" width="150" height="270" rx="8"/>
<text class="heading" x="200" y="64">PHASE 2</text>
<text class="title" x="200" y="88">Runs</text>
<text class="label" x="200" y="112">queue, limits</text>
<text class="label" x="200" y="130">scripted checks</text>
<text class="label" x="200" y="148">findings, merge</text>
<text class="label" x="200" y="166">spend</text>
<text class="heading" x="200" y="250">DONE WHEN</text>
<text class="small" x="200" y="270">a run gives a</text>
<text class="small" x="200" y="286">merged report</text>

<!-- Phase 3 -->
<rect class="box" x="352" y="40" width="150" height="270" rx="8"/>
<text class="heading" x="366" y="64">PHASE 3</text>
<text class="title" x="366" y="88">Droplet</text>
<text class="label" x="366" y="112">compose, Caddy</text>
<text class="label" x="366" y="130">cloud-init, setup</text>
<text class="label" x="366" y="148">GitHub App</text>
<text class="label" x="366" y="166">sign-in, settings</text>
<text class="label" x="366" y="184">agent tokens</text>
<text class="heading" x="366" y="250">DONE WHEN</text>
<text class="small" x="366" y="270">a fresh droplet is</text>
<text class="small" x="366" y="286">set up from the docs</text>

<!-- Phase 4 -->
<rect class="box" x="518" y="40" width="150" height="270" rx="8"/>
<text class="heading" x="532" y="64">PHASE 4</text>
<text class="title" x="532" y="88">Agents</text>
<text class="label" x="532" y="112">MCP endpoint</text>
<text class="label" x="532" y="130">start and poll,</text>
<text class="label" x="532" y="148">Tasks extension</text>
<text class="label" x="532" y="166">agent skill</text>
<text class="heading" x="532" y="250">DONE WHEN</text>
<text class="small" x="532" y="270">an agent fixes what</text>
<text class="small" x="532" y="286">Footfall found</text>

<!-- Phase 5 -->
<rect class="box" x="684" y="40" width="150" height="270" rx="8"/>
<text class="heading" x="698" y="64">PHASE 5</text>
<text class="title" x="698" y="88">Wall and report</text>
<text class="label" x="698" y="112">live device wall</text>
<text class="label" x="698" y="130">summary report</text>
<text class="label" x="698" y="148">replay, charts</text>
<text class="heading" x="698" y="250">DONE WHEN</text>
<text class="small" x="698" y="270">the mockups'</text>
<text class="small" x="698" y="286">layouts are live</text>

<!-- Phase 6 -->
<rect class="box-dashed" x="850" y="40" width="130" height="270" rx="8"/>
<text class="heading" x="864" y="64">LATER</text>
<text class="title" x="864" y="88">Next</text>
<text class="label" x="864" y="112">OAuth server</text>
<text class="label" x="864" y="130">replay a finding</text>
<text class="label" x="864" y="148">compare versions</text>
<text class="label" x="864" y="166">iOS on a Mac</text>

<path class="line" d="M170,210 H184" marker-end="url(#tip)"/>
<path class="line" d="M336,210 H350" marker-end="url(#tip)"/>
<path class="line" d="M502,210 H516" marker-end="url(#tip)"/>
