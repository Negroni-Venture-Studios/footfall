<title id="t">Footfall on one droplet: the parts that hold secrets never touch the code under test, and the parts that touch it hold nothing</title>
<desc id="d">Agents and people reach Footfall through Caddy. The web process serves the pages, sign-in, the MCP endpoint and live updates. The orchestrator runs the queue, clones repositories, runs the testers and merges their findings; it alone talks to the Anthropic API and fetches code from GitHub. Both share the database and screenshots. Only the runner holds the Docker socket, and for each run it starts an app container for every persona and one browser container, all under gVisor with no secrets. The orchestrator drives the browsers through Playwright; the browsers reach the app; anything else either container fetches goes through the egress proxy, which allows only the hosts the run's manifest names.</desc>
<defs>
  <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
  <marker id="tip-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow-accent"/></marker>
</defs>
<rect class="bg" width="1000" height="680"/>

<!-- Callers -->
