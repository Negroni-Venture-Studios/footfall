<!doctype html><body style="margin:0">
<!-- A check box drawn by its label: the box itself sits under the label's own picture of it. -->
<label style="position:absolute;left:20px;top:20px;width:200px;height:44px">
<input type="checkbox" id="agree" style="position:absolute;left:0;top:0;width:44px;height:44px;margin:0;z-index:-1">
<span style="position:absolute;left:0;top:0;width:200px;height:44px;background:#fff">I agree</span>
</label>
<button style="position:absolute;left:20px;top:100px;width:100px;height:44px">Pay now</button>
<label for="other" style="position:absolute;left:20px;top:100px;width:100px;height:44px;background:#fff">Not its label</label>
<input id="other" type="checkbox" style="position:absolute;left:300px;top:300px">
</body>
