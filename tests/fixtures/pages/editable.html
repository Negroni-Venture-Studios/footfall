<!doctype html><title>Editable</title><body style="margin:0">
<div contenteditable aria-label="Story" style="width:300px;height:50px;border:1px solid">Once upon a time</div>
<div contenteditable="plaintext-only" title="Note" style="width:300px;height:50px;border:1px solid"></div>
<div contenteditable="true" aria-label="Pay now" role="button" style="width:300px;height:50px">Draft</div>
<div contenteditable="false" aria-label="Fixed" style="width:300px;height:50px">Not editable</div>
<div contenteditable="FALSE" aria-label="Also fixed" style="width:300px;height:50px">Nor this</div>
</body>
