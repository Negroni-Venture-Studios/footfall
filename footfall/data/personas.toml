# The starting personas: a person, a device (named in devices.toml) and how they browse.
# Profiles and goals are adapted for the web from mobile-agent-testers' personas.json
# (MIT): https://github.com/pierridotite/mobile-agent-testers
# `geolocation` is [latitude, longitude]; `allow_location = false` means the persona
# refuses the location prompt. `text_scale` scales the root font size (0.5 to 3.0).
# `locale` is a language tag such as en-GB, and `timezone` a time zone such as Europe/London.

[[persona]]
id = "sven"
profile = "Retired engineer, 80, reads Swedish, needs the largest text on a small phone."
goal = "Complete one task: every button must stay readable and reachable."
device = "iPhone SE"
locale = "sv-SE"
timezone = "Europe/Stockholm"
color_scheme = "dark"
reduced_motion = false
text_scale = 2.0
geolocation = [59.3293, 18.0686]
allow_location = true

